name: Charts and cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/charts.yml"

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Terminal banner
        run: python scripts/banner.py

      - name: Skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      - name: Language & Domain radar
        run: python scripts/radar.py --data assets/langmix.json -o assets/radar-langs

      - name: Stat and repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --projects assets/projects.json \
            --out assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts and cards"
          git push
